name: Build Unsigned IPA

# Corre en cada push a master, en PRs, o manualmente desde la UI de GitHub
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Moonlight iOS – Unsigned IPA
    runs-on: macos-latest  # macOS Sequoia con Xcode 16.x

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Verificar versión de Xcode disponible ─────────────────────────
      - name: Show Xcode version
        run: xcodebuild -version

      # ── 3. Resolver dependencias Swift Package Manager ───────────────────
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Moonlight.xcodeproj

      # ── 4. Compilar para dispositivo real (arm64, iphoneos) ──────────────
      # Sin -derivedDataPath (incompatible con -target sin -scheme).
      # Sin pipe a xcpretty: si xcpretty no arranca o falla, el broken pipe
      # mata xcodebuild antes de escribir el .app.
      - name: Build (unsigned, iphoneos SDK)
        run: |
          xcodebuild build \
            -project Moonlight.xcodeproj \
            -target Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      # ── 5. Localizar el .app en DerivedData ──────────────────────────────
      # Usamos -name + -type d en lugar de -path glob, más robusto.
      # DerivedData sin -derivedDataPath → ~/Library/Developer/Xcode/DerivedData/
      - name: Locate Moonlight.app
        id: locate_app
        run: |
          echo "=== Contenido de DerivedData ==="
          ls ~/Library/Developer/Xcode/DerivedData/ 2>/dev/null || echo "(vacío o no existe)"

          APP=$(find ~/Library/Developer/Xcode/DerivedData \
                  -name "Moonlight.app" -type d 2>/dev/null | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: Moonlight.app no encontrado."
            echo "=== Todos los .app en DerivedData ==="
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

          echo "Encontrado: $APP"
          echo "APP_PATH=$APP" >> "$GITHUB_OUTPUT"

      # ── 6. Empaquetar como .ipa sin firma ─────────────────────────────────
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r "${{ steps.locate_app.outputs.APP_PATH }}" Payload/Moonlight.app
          zip -qry Moonlight-unsigned.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh Moonlight-unsigned.ipa | cut -f1)"

      # ── 7. Subir el artefacto ─────────────────────────────────────────────
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-${{ github.sha }}
          path: Moonlight-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
