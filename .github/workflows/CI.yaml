name: Build Unsigned IPA

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    name: Moonlight iOS – Unsigned IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Info de entorno ───────────────────────────────────────────────────
      - name: Show Xcode version
        run: xcodebuild -version

      # ── 3. Resolver dependencias SPM ─────────────────────────────────────────
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Moonlight.xcodeproj

      # ── 4. Compilar ──────────────────────────────────────────────────────────
      # -derivedDataPath requiere -scheme y no funciona con -target.
      # SYMROOT es un build setting (no un flag), funciona con -target y
      # controla exactamente dónde van los productos: $SYMROOT/Release-iphoneos/
      #
      # CODE_SIGNING_ALLOWED=NO impide que Xcode 16 empaquete el .app.
      # Usamos CODE_SIGN_IDENTITY="-" (ad-hoc local) que sí genera el bundle;
      # luego eliminamos la firma con codesign --remove-signature.
      - name: Build (ad-hoc signed, iphoneos SDK)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Moonlight.xcodeproj \
            -target Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            SYMROOT="$GITHUB_WORKSPACE/build" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee build.log
          grep -q "BUILD SUCCEEDED" build.log \
            || { echo "BUILD FAILED – últimas 60 líneas:"; tail -60 build.log; exit 1; }

      # ── 5. Localizar el .app ─────────────────────────────────────────────────
      - name: Locate Moonlight.app
        id: locate_app
        run: |
          echo "=== build/ contents ==="
          find "$GITHUB_WORKSPACE/build" -maxdepth 3 2>/dev/null || echo "(vacío)"

          APP=$(find "$GITHUB_WORKSPACE/build/Release-iphoneos" \
                  -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)

          if [ -z "$APP" ]; then
            echo "❌ No se encontró ningún .app en build/Release-iphoneos"
            exit 1
          fi

          echo "✅ Encontrado: $APP"
          echo "APP_PATH=$APP" >> "$GITHUB_OUTPUT"

      # ── 6. Eliminar firma ad-hoc ─────────────────────────────────────────────
      - name: Strip ad-hoc signature
        run: |
          APP="${{ steps.locate_app.outputs.APP_PATH }}"
          find "$APP" \( -name "*.dylib" -o -name "*.framework" \) | while read f; do
            codesign --remove-signature "$f" 2>/dev/null || true
          done
          codesign --remove-signature "$APP" 2>/dev/null || true

      # ── 7. Empaquetar como .ipa ──────────────────────────────────────────────
      - name: Package unsigned IPA
        run: |
          APP="${{ steps.locate_app.outputs.APP_PATH }}"
          mkdir -p Payload
          cp -r "$APP" "Payload/$(basename "$APP")"
          zip -qry Moonlight-unsigned.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh Moonlight-unsigned.ipa | cut -f1)"

      # ── 8. Subir artefacto ───────────────────────────────────────────────────
      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-${{ github.sha }}
          path: Moonlight-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
